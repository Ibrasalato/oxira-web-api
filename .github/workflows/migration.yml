name: Add EF Core migration

# Generates a migration from the current model and commits it (run from the Actions tab).
on:
  workflow_dispatch:
    inputs:
      name:
        description: Migration name
        required: true
        default: Initial

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global dotnet-ef --version 10.0.12
      - run: dotnet build Oxira.Web.slnx -c Debug
      - name: Add migration
        run: dotnet ef migrations add "${{ inputs.name }}" -p src/Oxira.Web.Infrastructure -s src/Oxira.Web.Api -o Data/Migrations --no-build
        env:
          ASPNETCORE_ENVIRONMENT: Development
      - name: Idempotent SQL script (for DBAs)
        run: dotnet ef migrations script --idempotent -p src/Oxira.Web.Infrastructure -s src/Oxira.Web.Api -o db/oxira-web.sql
        env:
          ASPNETCORE_ENVIRONMENT: Development
      - name: Commit
        run: |
          git config user.name "Ibrahim Salah"
          git config user.email "ibrasalato@gmail.com"
          git add src/Oxira.Web.Infrastructure/Data/Migrations db/oxira-web.sql
          git commit -m "Add migration ${{ inputs.name }}" || echo "nothing to commit"
          git push
